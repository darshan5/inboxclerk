<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InboxClerk{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    {% if user.is_authenticated %}
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="{% url 'dashboard' %}" class="text-xl font-bold text-gray-900">InboxClerk</a>
                    <a href="{% url 'dashboard' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'dashboard' %}text-blue-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">Dashboard</a>
                    <a href="{% url 'rule_list' %}" class="text-sm font-medium {% if 'rule' in request.resolver_match.url_name %}text-blue-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">Automations</a>
                    <a href="{% url 'execution_log' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'execution_log' %}text-blue-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">Logs</a>
                    <a href="{% url 'settings' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'settings' %}text-blue-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">Settings</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="text-sm text-red-500 hover:text-red-700">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
        {% for message in messages %}
        <div class="p-4 rounded-lg mb-2 {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200{% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
